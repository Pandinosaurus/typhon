[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "typhon"
description = "Typhon is a collection of tools for atmospheric research."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "The Typhon developers", email = "typhon.mi@lists.uni-hamburg.de"},
]
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "docutils",
    "fsspec!=2023.12.0,!=2023.12.1,!=2024.3.1",
    "h5netcdf",
    "imageio",
    "matplotlib>=1.4",
    "netCDF4>=1.1.1",
    "numexpr",
    "numpy>=2",
    "pandas",
    "scikit-image",
    "scikit-learn",
    "scipy>=1.6",
    "setuptools>=0.7.2",
    "xarray>=0.10.2",
]

[project.optional-dependencies]
docs = ["cartopy", "pint", "sphinx_rtd_theme"]
tests = ["pytest", "pint"]

[project.urls]
Homepage = "https://github.com/atmtools/typhon"
Source = "https://github.com/atmtools/typhon"
Download = "https://github.com/atmtools/typhon/releases"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["typhon*"]

[tool.setuptools.package-data]
"*" = [
    "VERSION",
    "*.act",
    "*.arts",
    "*.cpt",
    "*.csv",
    "*.dat",
    "*.gz",
    "*.mplstyle",
    "*.nc",
    "*.npy",
    "*.jpg",
    "*.tex",
    "*.txt",
    "*.xml",
    "*.xml.bin",
]
